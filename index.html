<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Below the Deep</title>
<style>
:root{--ice:#e4f6fb;--teal:#4fb7c7;--red:#ff6b5e;--ink:#03101a;--dusk:#c76b54}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--ice);font-family:"Gill Sans","Gill Sans MT",Candara,"Trebuchet MS",sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.screen.on{display:flex}
#menu{flex-direction:column;align-items:center}
#logo{margin-top:22vh;text-align:center;user-select:none}
#logo .sub{font-size:clamp(1rem,3vw,1.7rem);letter-spacing:.45em;text-indent:.45em;font-weight:300;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.word{position:relative;font-size:clamp(5rem,21vw,13rem);line-height:1;letter-spacing:.1em;text-indent:.1em;font-weight:600;margin-top:.05em}
.word span{display:block;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.up{background-image:linear-gradient(#fff,#bfe9f1);clip-path:inset(0 0 44% 0)}
.dn{position:absolute;inset:0;background-image:linear-gradient(#7cd8e4,#3c93a6);filter:url(#rip);clip-path:inset(55% 0 0 0);opacity:.88;-webkit-mask-image:linear-gradient(#000,rgba(0,0,0,.6));mask-image:linear-gradient(#000,rgba(0,0,0,.6))}
.wl{position:absolute;left:-8%;right:-8%;top:55.5%;height:2px;background:linear-gradient(90deg,transparent,rgba(228,246,251,.9),transparent);box-shadow:0 0 12px rgba(228,246,251,.6)}
#menu .btns{margin-top:auto;margin-bottom:11vh;display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{font:inherit;font-size:1.15rem;letter-spacing:.08em;color:var(--ice);background:rgba(3,16,26,.45);border:1px solid rgba(228,246,251,.55);border-radius:2px;padding:.8em 2.6em;min-width:230px;cursor:pointer;backdrop-filter:blur(6px);transition:background .2s,border-color .2s,transform .2s}
.btn:hover,.btn:focus-visible{background:rgba(79,183,199,.28);border-color:var(--ice);outline:none}
.btn:active{transform:scale(.98)}
.btn.red{border-color:var(--red);color:#ffd9d4}.btn.red:hover,.btn.red:focus-visible{background:rgba(255,107,94,.25)}
.btn.quiet{border-color:transparent;background:none;min-width:0;padding:.5em 1em;opacity:.8}
.note{font-size:.85rem;opacity:.7}
#saves{flex-direction:column;align-items:center;justify-content:center;background:rgba(2,10,18,.8);backdrop-filter:blur(5px)}
#saves h2{font-weight:300;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:.08em;margin-bottom:6px}
#saves p{opacity:.7;margin-bottom:22px}
#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(860px,100%);margin-bottom:22px}
.slot{font:inherit;color:inherit;text-align:left;padding:18px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(228,246,251,.06);border:1px solid rgba(228,246,251,.25);border-radius:3px;cursor:pointer;transition:background .2s,border-color .2s}
.slot:hover,.slot:focus-visible{background:rgba(79,183,199,.16);border-color:var(--teal);outline:none}
.slot b{font-size:1.15rem;font-weight:600}.slot span{opacity:.75;font-size:.95rem}
.slot em{font-style:normal;font-size:.85rem;color:var(--teal)}
.slot.hardcore{border-color:rgba(255,107,94,.55)}.slot.hardcore em{color:var(--red)}
.slot.creative em{color:#b9e68a}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(1,6,12,.7);z-index:5}
#modal.on{display:flex}
.box{width:min(560px,100%);max-height:90vh;overflow:auto;background:#07202e;border:1px solid rgba(228,246,251,.35);border-radius:3px;padding:26px}
.box h2{font-weight:600;font-size:1.4rem;margin-bottom:6px}.box>p{opacity:.75;margin-bottom:18px}
.opt{display:block;width:100%;font:inherit;color:inherit;text-align:left;padding:14px 16px;margin-bottom:10px;background:rgba(228,246,251,.06);border:1px solid rgba(228,246,251,.3);border-radius:3px;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:var(--teal);background:rgba(79,183,199,.16);outline:none}
.opt.h{border-color:rgba(255,107,94,.6)}.opt.h:hover,.opt.h:focus-visible{background:rgba(255,107,94,.18);border-color:var(--red)}
.opt b{display:block;font-size:1.1rem}.opt span{opacity:.75;font-size:.93rem}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1;min-width:120px;padding:.7em 1em}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;margin-bottom:18px}dt{opacity:.7}dd{text-align:right}
#game{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;background:#02080f}
#game h2{font-weight:300;font-size:clamp(1.5rem,4vw,2.2rem)}#game p{max-width:46ch;opacity:.75}
.row{justify-content:center}.box .row+.row,#saves .row,#game .row{margin-top:10px}#menu .row .btn{flex:none;min-width:230px;padding:.8em 2.6em}.row .btn.quiet{flex:0 0 auto;min-width:0;padding:.5em 1em}
@media(max-width:640px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.slot{min-height:96px;padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="rip" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="tb" type="fractalNoise" baseFrequency="0.012 0.08" numOctaves="1" seed="3"/><feDisplacementMap in="SourceGraphic" scale="16"/></filter></svg>
<canvas id="c"></canvas>

<main id="menu" class="screen on">
  <div id="logo"><div class="sub">Below the</div>
    <div class="word" aria-label="Deep"><span class="up">DEEP</span><span class="dn" aria-hidden="true">DEEP</span><i class="wl"></i></div></div>
  <div class="btns" id="mbtns"></div>
</main>

<section id="saves" class="screen"></section>

<section id="game" class="screen"></section>
<div id="modal"><div class="box" id="box"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Ocean scene ---------- */
const cv=document.getElementById('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,1500),rig=new THREE.Group();S.add(rig);rig.add(cam);R.xr.enabled=true;

const H=`float h(vec2 p,float t){return sin(p.x*.35+t*.9)*.38+sin(p.y*.5-t*.7+p.x*.2)*.26+sin((p.x+p.y)*.8+t*1.5)*.1;}`;
const U={t:{value:0},cam:{value:new THREE.Vector3()}};
const g=new THREE.PlaneGeometry(1200,1200,260,260);g.rotateX(-Math.PI/2);
const ocean=new THREE.Mesh(g,new THREE.ShaderMaterial({uniforms:U,

 void main(){vec4 w=modelMatrix*vec4(position,1.);vec2 p=w.xz;float e=.15;w.y+=h(p,t);
 vN=normalize(vec3(h(p-vec2(e,0.),t)-h(p+vec2(e,0.),t),2.*e,h(p-vec2(0.,e),t)-h(p+vec2(0.,e),t)));vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
 fragmentShader:`uniform float t;uniform vec3 cam;varying vec3 vW;varying vec3 vN;
 void main(){vec3 v=normalize(cam-vW);vec3 n=normalize(vN+vec3(sin(vW.x*3.+t*2.),0.,cos(vW.z*3.4-t*1.7))*.04);
 float nv=max(dot(n,v),0.),f=pow(1.-nv,4.);vec3 r=reflect(-v,n);
 vec3 skyc=mix(${HOR},vec3(.04,.08,.2),pow(clamp(r.y,0.,1.),.4));
 vec3 c=mix(mix(vec3(.01,.05,.09),vec3(.03,.2,.27),nv*.5),skyc,f*.9+.04);
 c+=vec3(1.,.65,.4)*pow(max(dot(r,${SUN}),0.),220.)*1.6;
 c=mix(c,${HOR}*.75,smoothstep(80.,520.,length(vW.xz-cam.xz)));gl_FragColor=vec4(c,1.);}`}));
S.add(ocean);
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth/innerHeight<.8?75:60;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
const tb=document.getElementById('tb'),$=id=>document.getElementById(id),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const FONT='"Gill Sans","Gill Sans MT",Candara,"Trebuchet MS",sans-serif',COL={survival:'#4fb7c7',hardcore:'#ff6b5e',creative:'#b9e68a'};

/* ---------- Saves and UI state (shared by browser and VR) ---------- */
const KEY='btd_saves_v1',N=6;

function screen(){
 if(scr==='saves')return{title:'Choose a save slot',text:'Pick an empty slot to start a new game.',
  cards:saves.map((s,i)=>({l:'Slot '+(i+1),sub:s?`Day ${s.day}, ${fmt(s.time)}`:'Empty',tag:s?cap(s.mode):'',cls:s?s.mode:'',fn:()=>s?slotMenu(i):modePick(i)})),
  btns:[{l:'Back to menu',cls:'quiet',fn:()=>go('main')}]};
 if(scr==='game')return{title:info.t,text:info.p,btns:[{l:'Back to save slots',fn:()=>go('saves')}]};
 const b=[{l:'Play',fn:()=>go('saves')}];
 if(xrOK&&!vr)b.push({l:'Enter VR',fn:enterVR});
 if(vr)b.push({l:'Exit VR',cls:'quiet',fn:()=>{const s=R.xr.getSession();s&&s.end()}});
 return{bg:false,btns:b};
}
function modePick(i){mod={title:`New game in slot ${i+1}`,text:'Choose how you want to survive.',
 opts:[['Survival','Hunger, thirst, oxygen. You respawn at the lifeboat.','survival'],['Hardcore','Tougher creatures and no respawns. One death ends the run.','hardcore'],['Creative','No threats, free building, intro can be skipped.','creative']]
 .map(o=>({l:o[0],sub:o[1],cls:o[2]==='hardcore'?'h':'',fn:()=>{saves[i]={mode:o[2],created:Date.now(),day:1,time:0,deepest:0,crafted:0,deaths:0};store();start(i)}})),
 btns:[{l:'Cancel',cls:'quiet',fn:shut}]};ui()}
function slotMenu(i){const s=saves[i];mod={title:`Slot ${i+1}: ${cap(s.mode)}`,text:`Day ${s.day}, ${fmt(s.time)} played.`,
 btns:[{l:'Play',fn:()=>start(i)},{l:'Stats',fn:()=>stats(i)},{l:'Delete',cls:'red',fn:()=>confirmDel(i)},{l:'Close',cls:'quiet',fn:shut}]};ui()}
function stats(i){const s=saves[i];mod={title:`Stats for slot ${i+1}`,text:cap(s.mode)+' mode',rows:[['Started',new Date(s.created).toLocaleDateString()],['Time played',fmt(s.time)],['Days survived',s.day],['Deepest dive',s.deepest+' m'],['Items crafted',s.crafted],['Deaths',s.deaths]],btns:[{l:'Back',fn:()=>slotMenu(i)}]};ui()}

/* ---------- Browser renderer ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function html(d,el){const f=[],reg=fn=>f.push(fn)-1;let h='';
 if(d.title)h+=`<h2>${esc(d.title)}</h2>`;if(d.text)h+=`<p>${esc(d.text)}</p>`;
 if(d.rows)h+='<dl>'+d.rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')+'</dl>';
 if(d.cards)h+='<div id="grid">'+d.cards.map(c=>`<button class="slot ${c.cls}" data-f="${reg(c.fn)}">${c.tag?`<em>${c.tag}</em>`:''}<b>${c.l}</b><span>${c.sub}</span></button>`).join('')+'</div>';
 if(d.opts)h+=d.opts.map(o=>`<button class="opt ${o.cls}" data-f="${reg(o.fn)}"><b>${o.l}</b><span>${o.sub}</span></button>`).join('');
 const bt=d.btns||[],bh=b=>`<button class="btn ${b.cls||''}" data-f="${reg(b.fn)}">${b.l}</button>`;
 const nb=bt.filter(b=>b.cls!=='quiet'),qb=bt.filter(b=>b.cls==='quiet');
 if(nb.length)h+=`<div class="row">${nb.map(bh).join('')}</div>`;if(qb.length)h+=`<div class="row">${qb.map(bh).join('')}</div>`;
 el.innerHTML=h;el.onclick=e=>{const b=e.target.closest('[data-f]');if(b)f[+b.dataset.f]()}}
function ui(){const d=screen();
 document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===(scr==='main'?'menu':scr)));
 if(scr==='main'){html(d,$('mbtns'));$('mbtns').insertAdjacentHTML('beforeend','<span class="note">Version 0.2, with VR menu</span>')}else html(d,$(scr));
 if(mod){html(mod,$('box'));$('modal').classList.add('on');const b=$('box').querySelector('button');b&&b.focus()}else $('modal').classList.remove('on');
 lg.visible=scr==='main';dirty=true}
$('modal').onclick=e=>{if(e.target.id==='modal')shut()};addEventListener('keydown',e=>{if(e.key==='Escape'&&mod)shut()});

/* ---------- VR: panel, logo, controller rays ---------- */
const vg=new THREE.Group(),lg=new THREE.Group();vg.visible=false;rig.add(vg);vg.add(lg);
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const PW=1024,PH=640,pc=mk(PW,PH),px=pc.getContext('2d'),ptex=new THREE.CanvasTexture(pc);
const mat=t=>new THREE.MeshBasicMaterial({map:t,transparent:true,depthTest:false});
const pm=new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.5),mat(ptex));pm.position.set(0,1.3,-1.9);pm.rotation.x=-.12;pm.renderOrder=10;vg.add(pm);
/* logo: drawn once, split at the waterline; the lower half is redrawn with a ripple so it shows through the water */
const LW=1024,LH=600,WY=445,lc=mk(LW,LH),lx=lc.getContext('2d'),tc=mk(LW,WY),bc=mk(LW,LH-WY),bx=bc.getContext('2d');
lx.textAlign='center';lx.fillStyle='#e4f6fb';lx.font='300 54px '+FONT;if('letterSpacing' in lx)lx.letterSpacing='20px';lx.fillText('Below the',LW/2+10,140);
const gr=lx.createLinearGradient(0,324,0,540);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#bfe9f1');
lx.fillStyle=gr;lx.font='600 300px '+FONT;if('letterSpacing' in lx)lx.letterSpacing='30px';lx.fillText('DEEP',LW/2+15,540);
tc.getContext('2d').drawImage(lc,0,0,LW,WY,0,0,LW,WY);
const btex=new THREE.CanvasTexture(bc),SC=6/LW,JY=.35;
function ripple(t){const h=LH-WY;bx.globalCompositeOperation='source-over';bx.clearRect(0,0,LW,h);
 for(let y=0;y<h;y+=2)bx.drawImage(lc,0,WY+y,LW,2,Math.sin(y*.09+t*2.2)*7+Math.sin(y*.23-t*1.4)*3,y,LW,2);
 bx.globalCompositeOperation='source-atop';const g=bx.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(90,200,215,.95)');g.addColorStop(1,'rgba(35,110,135,.75)');
 bx.fillStyle=g;bx.fillRect(0,0,LW,h);btex.needsUpdate=true}
const lt=new THREE.Mesh(new THREE.PlaneGeometry(LW*SC,WY*SC),mat(new THREE.CanvasTexture(tc))),lb=new THREE.Mesh(new THREE.PlaneGeometry(LW*SC,(LH-WY)*SC),mat(btex));
const ll=new THREE.Mesh(new THREE.PlaneGeometry(7,.025),new THREE.MeshBasicMaterial({color:0xe4f6fb,transparent:true,opacity:.85,depthTest:false}));
lt.position.y=JY+WY*SC/2;lb.position.y=JY-(LH-WY)*SC/2;ll.position.y=JY;[lt,lb,ll].forEach(m=>{m.renderOrder=9;lg.add(m)});lg.position.z=-8;ripple(0);

const rr=(x,y,w,h,fill,stroke)=>{px.beginPath();px.roundRect?px.roundRect(x,y,w,h,6):px.rect(x,y,w,h);px.fillStyle=fill;px.fill();if(stroke){px.strokeStyle=stroke;px.lineWidth=2;px.stroke()}};
const wrap=(t,m)=>{const L=[];let c='';t.split(' ').forEach(w=>{const n=c?c+' '+w:w;if(px.measureText(n).width>m&&c){L.push(c);c=w}else c=n});L.push(c);return L};
function hit(x,y,w,h,id,fn,live){if(live)hits.push({x,y,w,h,id,fn});return live&&hover===id}
function lay(d,X,W,live,tag,y){const cx=X+W/2,pad=36;px.textAlign='center';
 if(d.title){px.fillStyle='#e4f6fb';px.font='600 44px '+FONT;px.fillText(d.title,cx,y+40);y+=62}
 if(d.text){px.fillStyle='rgba(228,246,251,.75)';px.font='28px '+FONT;wrap(d.text,W-2*pad).forEach(l=>{px.fillText(l,cx,y+30);y+=36});y+=14}
 if(d.rows){px.font='30px '+FONT;d.rows.forEach(r=>{px.textAlign='left';px.fillStyle='rgba(228,246,251,.7)';px.fillText(r[0],X+pad+40,y+30);px.textAlign='right';px.fillStyle='#e4f6fb';px.fillText(String(r[1]),X+W-pad-40,y+30);y+=44});y+=10}
 if(d.cards){const g=16,cw=(W-2*pad-2*g)/3,ch=138;d.cards.forEach((c,i)=>{const x=X+pad+(i%3)*(cw+g),yy=y+Math.floor(i/3)*(ch+g),hv=hit(x,yy,cw,ch,tag+'c'+i,c.fn,live);
  rr(x,yy,cw,ch,hv?'rgba(79,183,199,.3)':'rgba(228,246,251,.07)',hv?'#4fb7c7':c.cls==='hardcore'?'rgba(255,107,94,.65)':'rgba(228,246,251,.3)');
  px.textAlign='left';if(c.tag){px.fillStyle=COL[c.cls];px.font='22px '+FONT;px.fillText(c.tag,x+18,yy+34)}
  px.fillStyle='#e4f6fb';px.font='600 30px '+FONT;px.fillText(c.l,x+18,yy+78);px.fillStyle='rgba(228,246,251,.75)';px.font='24px '+FONT;px.fillText(c.sub,x+18,yy+112)});
  y+=Math.ceil(d.cards.length/3)*(ch+g)+6}
 if(d.opts)d.opts.forEach((o,i)=>{const x=X+pad,w=W-2*pad,hv=hit(x,y,w,88,tag+'o'+i,o.fn,live);
  rr(x,y,w,88,hv?(o.cls?'rgba(255,107,94,.25)':'rgba(79,183,199,.3)'):'rgba(228,246,251,.07)',hv?'#e4f6fb':o.cls?'rgba(255,107,94,.65)':'rgba(228,246,251,.3)');
  px.textAlign='left';px.fillStyle='#e4f6fb';px.font='600 30px '+FONT;px.fillText(o.l,x+20,y+37);px.fillStyle='rgba(228,246,251,.75)';px.font='21px '+FONT;px.fillText(o.sub,x+20,y+68);y+=98});
 const bt=d.btns||[],nb=bt.filter(b=>b.cls!=='quiet'),qb=bt.filter(b=>b.cls==='quiet');
 if(nb.length){const bw=Math.min(300,(W-2*pad-(nb.length-1)*14)/nb.length),x0=cx-(nb.length*bw+(nb.length-1)*14)/2;
  nb.forEach((b,i)=>{const x=x0+i*(bw+14),hv=hit(x,y,bw,70,tag+'b'+i,b.fn,live),rd=b.cls==='red';
   rr(x,y,bw,70,hv?(rd?'rgba(255,107,94,.3)':'rgba(79,183,199,.35)'):'rgba(3,16,26,.6)',hv?'#e4f6fb':rd?'#ff6b5e':'rgba(228,246,251,.6)');
   px.textAlign='center';px.fillStyle='#e4f6fb';px.font='30px '+FONT;px.fillText(b.l,x+bw/2,y+45)});y+=84}
 qb.forEach((b,i)=>{const hv=hit(cx-110,y,220,56,tag+'q'+i,b.fn,live);if(hv)rr(cx-110,y,220,56,'rgba(228,246,251,.12)');
  px.textAlign='center';px.fillStyle=hv?'#fff':'rgba(228,246,251,.8)';px.font='26px '+FONT;px.fillText(b.l,cx,y+37);y+=60})}
