 const place=(o,sz,lb,bh)=>{const x=off+sz.x/2+.5,px=hx+fx*8+rx*(x-10),pz=hz+fz*8+rz*(x-10);[o,bh,lb].forEach(e=>{e.position.x+=px;e.position.z+=pz;e.position.y+=fy});off+=sz.x+1.5;o.rotation.y=0};
 const av=mkAvatar(0,'1.8 m diver');WG.remove(av.g);av.sp.visible=false;{const w=new THREE.Group();w.add(av.g);const r=put(w,0,0xffffff,'Diver 1.8 m');r.sz.x=Math.max(r.sz.x,.8);place(w,r.sz,r.lb,r.bh)}
 names.forEach(n=>{const i=inst(n),f=MFIT[n]||['max',1],r=put(i.g,0,0x4fb7c7,'');g.remove(r.lb);const t=mkLabel(n+': '+r.sz.x.toFixed(2)+' x '+r.sz.y.toFixed(2)+' x '+r.sz.z.toFixed(2)+' m (target '+f[1]+' m '+f[0]+')');t.scale.set(Math.max(3,r.sz.x),Math.max(.75,r.sz.x*.25),1);t.position.set(0,r.sz.y+.6,0);g.add(t);place(i.g,r.sz,t,r.bh)});
 for(let m=0;m<=Math.ceil(off);m++){const k=new THREE.Mesh(new THREE.BoxGeometry(.04,m%5?.15:.4,.04),ln);k.position.set(hx+fx*8+rx*(m-10),fy+.1,hz+fz*8+rz*(m-10));g.add(k)}
 STG=g;WG.add(g);toast('Stage in front of you: a 1.8 m diver, each model at its in-game size, a marker every metre. Boxes show the real bounds.')}

function atPlace(){const A=AT,fl=Math.hypot(fw.x,fw.z)||1,fx=fw.x/fl,fz=fw.z/fl,d=Math.max(4,(A.sz||2)*1.3);A.g.position.set(v3.x+fx*d,v3.y-1.6,v3.z+fz*d);A.g.rotation.y=Math.atan2(fx,fz)}
function atDo(a,v){const A=AT,o=A.o;
 if(a==='close')return animTester();
 if(a==='sel'){while(A.g.children.length)A.g.remove(A.g.children[0]);A.n=v;A.o=null;A.dv=null;A.sz=2;

 else if(a==='mode')A.mode=v;else if(a==='place')atPlace();else if(a==='spin')A.spin=!A.spin;
 else if(o&&o.mix){o.mix.stopAllAction();o.cur=null;o.once=0;o.fp=false;
  if(a==='role'){if(v==='attack')playOnce(o,v);else setRole(o,v,A.sp)}
  else{const c=o.all[+v];c.reset().setLoop(a==='once'?THREE.LoopOnce:THREE.LoopRepeat,a==='once'?1:Infinity).setEffectiveWeight(1).play();c.clampWhenFinished=true;c.timeScale=A.sp}}
 atUI()}
function atUI(){const A=AT,on=' style="outline:2px solid #4fb7c7"';let h='<b>Animation tester</b> <button data-a="close">close</button><br>Pick a model. It appears in front of you at its in-game size.<br>';

 if(A.dv)h+='<hr>Built-in diver animations (the same code other players use):<br>'+['idle','walk','swim'].map(m=>`<button data-a="mode" data-v="${m}"${A.mode===m?on:''}>${m}</button>`).join(' ');
 if(A.o){const o=A.o;h+='<hr>Game roles (what the game plays and which clip it picks):<br>'+Object.keys(ROLE).map(r=>`<button data-a="role" data-v="${r}">${r}</button> \u2192 `+(o.act[r]?o.act[r].getClip().name:'<span style="color:#f99">no clip, falls back to '+(o.act.swim?'swim':o.act.idle?'idle':o.any?'the first clip':'nothing')+'</span>')).join('<br>');

  if(o.act.fist)h+='<br>Fist <input id="atfist" type="range" min="0" max="1" step=".01" value="0">'}
