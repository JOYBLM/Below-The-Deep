<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Below the Deep</title>
<style>

*{box-sizing:border-box;margin:0}

.up{background-image:linear-gradient(#fff,#bfe9f1);clip-path:inset(0 0 44% 0)}
.dn{position:absolute;inset:0;background-image:linear-gradient(#7cd8e4,#3c93a6);filter:url(#rip);clip-path:inset(55% 0 0 0);opacity:.88;-webkit-mask-image:linear-gradient(#000,rgba(0,0,0,.6));mask-image:linear-gradient(#000,rgba(0,0,0,.6))}

.btn{font:inherit;font-size:1.15rem;letter-spacing:.08em;color:var(--ice);background:rgba(3,16,26,.45);border:1px solid rgba(228,246,251,.55);border-radius:2px;padding:.8em 2.6em;min-width:230px;cursor:pointer;backdrop-filter:blur(6px);transition:background .2s,border-color .2s,transform .2s}

.btn:active{transform:scale(.98)}
.btn.red{border-color:var(--red);color:#ffd9d4}.btn.red:hover,.btn.red:focus-visible{background:rgba(255,107,94,.25)}

.slot.creative em{color:#b9e68a}

dl{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;margin-bottom:18px}dt{opacity:.7}dd{text-align:right}
#game{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;background:#02080f}
#game h2{font-weight:300;font-size:clamp(1.5rem,4vw,2.2rem)}#game p{max-width:46ch;opacity:.75}
.row{justify-content:center}.box .row+.row,#saves .row,#game .row{margin-top:10px}#menu .row .btn{flex:none;min-width:230px;padding:.8em 2.6em}.row .btn.quiet{flex:0 0 auto;min-width:0;padding:.5em 1em}
#hud{position:fixed;inset:0;display:none;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}#hud.on{display:block}
.bars{position:absolute;top:14px;left:14px;width:150px;display:flex;flex-direction:column;gap:7px;font-size:.82rem}.cre .bars{display:none}
.bars i{display:block;height:6px;margin-top:2px;border-radius:3px;background:var(--teal);transition:width .2s}#b_f{background:#e8b04a}#b_w{background:#6fa8ff}
#dep{position:absolute;top:14px;right:14px}#toast{position:absolute;left:10%;right:10%;bottom:20vh;text-align:center;opacity:0;transition:opacity .4s;text-shadow:0 2px 10px #000}

@media(max-width:640px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.slot{min-height:96px;padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
